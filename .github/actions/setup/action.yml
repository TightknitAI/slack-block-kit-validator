name: Setup
description: Install pnpm, Node.js, and dependencies

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
  registry-url:
    description: npm registry URL. When set, setup-node writes an .npmrc that authenticates `pnpm publish` via NODE_AUTH_TOKEN.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - run: pnpm install --frozen-lockfile
      shell: bash
